<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Loonie — Link a bank account (dev test page)</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body style="font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto;">
  <h2>Loonie — dev test page</h2>
  <p>Not part of the app. Just wires up Plaid Link locally so we can test the
     nudge loop end-to-end.</p>

  <label>API base URL (your tunnel):</label><br>
  <input id="apiBase" style="width:100%; margin: 8px 0;" placeholder="https://your-tunnel-url" /><br>

  <label>Setup secret (from your .env):</label><br>
  <input id="setupSecret" type="password" style="width:100%; margin: 8px 0;" /><br><br>

  <button id="linkBtn" style="padding: 10px 20px;">Link a bank account</button>
  <pre id="log" style="background:#f5f5f5; padding: 12px; margin-top: 20px; white-space: pre-wrap;"></pre>

  <script>
    const log = (msg) => {
      document.getElementById('log').textContent += msg + "\n";
    };

    document.getElementById('linkBtn').addEventListener('click', async () => {
      const apiBase = document.getElementById('apiBase').value.replace(/\/$/, '');
      const setupSecret = document.getElementById('setupSecret').value;

      log('Requesting link_token...');
      const tokenResp = await fetch(`${apiBase}/plaid/link-token`, {
        method: 'POST',
        headers: { 'X-Loonie-Setup-Secret': setupSecret },
      });
      if (!tokenResp.ok) {
        log('Failed to get link_token: ' + tokenResp.status + ' ' + await tokenResp.text());
        return;
      }
      const { link_token } = await tokenResp.json();
      log('Got link_token. Opening Plaid Link...');

      const handler = Plaid.create({
        token: link_token,
        onSuccess: async (public_token, metadata) => {
          log('Link succeeded for: ' + metadata.institution.name);
          log('Exchanging public_token...');
          const exchangeResp = await fetch(`${apiBase}/plaid/exchange-token?public_token=${encodeURIComponent(public_token)}`, {
            method: 'POST',
            headers: { 'X-Loonie-Setup-Secret': setupSecret },
          });
          const result = await exchangeResp.json();
          log('Exchange result: ' + JSON.stringify(result));
          log('Done. New transactions should trigger Telegram nudges via webhook.');
        },
        onExit: (err, metadata) => {
          if (err) log('Link exited with error: ' + JSON.stringify(err));
          else log('Link exited without completing.');
        },
      });

      handler.open();
    });
  </script>
</body>
</html>
