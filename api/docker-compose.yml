services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qolar
      POSTGRES_PASSWORD: qolar
      POSTGRES_DB: qolar
    ports:
      - "5432:5432"
    volumes:
      - qolar_pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  qolar_pgdata:
